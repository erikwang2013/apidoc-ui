    <path d="M 156 52 L 156 88 L 192 88 Z" fill="#DCD7F7" stroke="#3B3663" stroke-width="5"/>
    <!-- 头顶嫩芽 -->
    <path d="M 100 54 C 100 46 98 40 95 35" fill="none" stroke="#3B3663" stroke-width="5"/>
    <path d="M 95 35 C 82 34 73 27 75 16 C 87 17 95 25 95 35 Z" fill="#7ED9A0" stroke="#3B3663" stroke-width="5"/>
    <!-- 表情 -->
    <g fill="#3B3663">
      <circle cx="112" cy="114" r="10"/>
      <circle cx="148" cy="114" r="10"/>
    </g>
    <g fill="#FFFFFF">
