      <path d="M 78 122 Q 58 132 50 142"/>
      <path d="M 182 116 Q 200 106 206 94"/>
    </g>
    <!-- 脚 -->
    <g fill="#3B3663">
      <ellipse cx="108" cy="196" rx="15" ry="9"/>
      <ellipse cx="152" cy="196" rx="15" ry="9"/>
    </g>
    <!-- 身体:文档页 -->
    <path d="M 84 52 H 156 L 192 88 V 172 A 16 16 0 0 1 176 188 H 84 A 16 16 0 0 1 68 172 V 68 A 16 16 0 0 1 84 52 Z" fill="#FFFFFF" stroke="#3B3663" stroke-width="6"/>
