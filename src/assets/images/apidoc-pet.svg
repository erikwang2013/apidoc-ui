    </g>
    <path d="M 122 132 Q 130 141 138 132" fill="none" stroke="#3B3663" stroke-width="4.5"/>
    <!-- 胸前 attributes 徽章 -->
    <rect x="90" y="152" width="80" height="26" rx="13" fill="#6C5CE7" stroke="#3B3663" stroke-width="4"/>
    <text x="130" y="170" text-anchor="middle" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700" fill="#FFFFFF">#[API-UI]</text>
    <!-- 手 -->
    <g fill="#3B3663">
      <circle cx="48" cy="144" r="8"/>
      <circle cx="208" cy="90" r="8"/>
