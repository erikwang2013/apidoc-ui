<!DOCTYPE html>
<html lang="en" >
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- CSP 由 config/vite/plugins/csp.ts 在启动/构建时生成 nonce 后替换此处的占位。
         config.js/LOAD_SCRIPTS 通过 nonce + strict-dynamic 放行。
         frame-ancestors 不能放在 meta 里（浏览器忽略并告警），如需防 iframe 嵌套请由服务端响应头下发 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="object-src 'none'; base-uri 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <title>Apidoc</title>
  </head>
  <body >
    <div id="app"></div>
    <%- injectScript %>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
